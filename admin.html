<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تسجيل دخول الأدمن</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
direction:rtl;
font-family:Arial;
background:#eef2f3;
}

.login-box{
width:330px;
margin:80px auto;
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 4px 10px #ccc;
}

.icon{
font-size:45px;
color:#ff6b35;
margin-bottom:10px;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border:1px solid #bbb;
border-radius:8px;
}

button{
width:95%;
padding:12px;
background:#ff6b35;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#e85a24;
}
</style>

<script>
function login(){
window.location.href="dashboard.html";
}
</script>

</head>

<body>

<div class="login-box">

<div class="icon">
<i class="fa-solid fa-user-shield"></i>
</div>

<h2>تسجيل دخول الأدمن</h2>

<input type="text" placeholder="اسم المستخدم">

<input type="password" placeholder="كلمة المرور">

<button onclick="login()">
تسجيل الدخول
</button>

</div>

</body>
</html>
